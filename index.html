<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RESTSTOP // Clean Restroom Radar</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: pan-x pan-y;
      background-color: #f8fafc;
    }
    .font-display {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    #map {
      height: 100vh;
      width: 100vw;
      background: #e2e8f0;
      z-index: 1;
    }
    /* 明るく清潔感のあるポップアップスタイル */
    .leaflet-popup-content-wrapper {
      background: rgba(255, 255, 255, 0.98) !important;
      backdrop-filter: blur(12px) !important;
      border: 1px solid rgba(226, 232, 240, 0.9) !important;
      color: #0f172a !important;
      border-radius: 1.25rem !important;
      box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.12), 0 8px 10px -6px rgba(15, 23, 42, 0.08) !important;
      padding: 0 !important;
      overflow: hidden;
    }
    .leaflet-popup-content { margin: 0 !important; }
    .leaflet-popup-tip {
      background: rgba(255, 255, 255, 0.98) !important;
      border: 1px solid rgba(226, 232, 240, 0.9) !important;
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translateY(-8px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-float-in {
      animation: floatIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 overflow-hidden select-none m-0 p-0">

  <!-- =============================== -->
  <!-- トップ操作ヘッダー -->
  <!-- =============================== -->
  <header class="fixed top-3 inset-x-3 sm:inset-x-auto sm:left-4 sm:right-4 sm:max-w-md sm:mx-auto z-40 flex flex-col gap-2 pointer-events-none">
    
    <!-- 操作カード（ホワイト・グラス調） -->
    <div class="pointer-events-auto bg-white/90 backdrop-blur-xl border border-slate-200/90 p-3.5 rounded-2xl shadow-xl shadow-slate-200/70 flex flex-col gap-2.5">
      
      <!-- タイトル & ビュー切替 & 言語トグル -->
      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-sky-500 to-blue-600 flex items-center justify-center text-white shadow-md shadow-sky-500/25">
            <i data-lucide="map-pin" class="w-4 h-4 stroke-[2.5]"></i>
          </div>
          <div>
            <h1 class="font-display text-xs tracking-wider font-extrabold text-slate-900 flex items-center gap-1.5">
              <span>RESTSTOP</span>
              <span class="text-[9px] font-bold px-1.5 py-0.5 rounded-md bg-sky-50 text-sky-600 border border-sky-200">RADAR</span>
            </h1>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <!-- マップ / リスト 切り替えスイッチ -->
          <div class="bg-slate-100 p-0.5 rounded-xl border border-slate-200 flex items-center">
            <button 
              id="view-map-btn"
              type="button" 
              class="px-2.5 py-1 rounded-lg text-[10px] font-bold flex items-center gap-1 transition-all bg-white text-slate-900 shadow-sm"
            >
              <i data-lucide="map" class="w-3 h-3 text-sky-600"></i>
              <span id="tab-map-text">MAP</span>
            </button>
            <button 
              id="view-list-btn"
              type="button" 
              class="px-2.5 py-1 rounded-lg text-[10px] font-bold flex items-center gap-1 transition-all text-slate-500 hover:text-slate-800"
            >
              <i data-lucide="list" class="w-3 h-3"></i>
              <span id="tab-list-text">LIST</span>
            </button>
          </div>

          <!-- 言語トグル -->
          <button 
            id="lang-toggle-btn"
            type="button" 
            class="px-2 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 text-[10px] font-bold tracking-wider transition-colors flex items-center gap-1"
          >
            <i data-lucide="globe" class="w-3 h-3 text-slate-500"></i>
            <span id="lang-label">EN</span>
          </button>
        </div>
      </div>

      <!-- 検索バー -->
      <form id="search-form" class="flex gap-1.5" action="javascript:void(0);">
        <div class="relative flex-1">
          <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input 
            id="search-input" 
            type="search" 
            enterkeyhint="search"
            placeholder="Search worldwide..." 
            class="w-full bg-slate-50/90 border border-slate-200 rounded-xl pl-9 pr-3 py-2 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-sky-500 focus:bg-white transition-all shadow-inner"
          />
        </div>
        <button 
          type="submit" 
          id="search-submit-btn"
          class="px-3.5 py-2 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 active:scale-95 text-white font-bold text-xs rounded-xl shadow-md shadow-sky-500/25 transition-all flex items-center justify-center whitespace-nowrap"
        >
          <span>検索</span>
        </button>
      </form>

      <!-- 半径フィルター -->
      <div class="flex items-center gap-1.5 pt-1 border-t border-slate-100">
        <span id="radius-label" class="text-[10px] text-slate-400 font-bold uppercase tracking-wider pl-1">Range:</span>
        <div class="grid grid-cols-4 gap-1.5 flex-1" id="radius-btn-group">
          <button type="button" data-radius="300" data-zoom="17" class="radius-btn py-1 text-[11px] rounded-lg font-bold border transition-all text-slate-500 border-slate-200 bg-slate-50 hover:bg-slate-100">
            300m
          </button>
          <button type="button" data-radius="500" data-zoom="16" class="radius-btn py-1 text-[11px] rounded-lg font-bold border transition-all text-slate-500 border-slate-200 bg-slate-50 hover:bg-slate-100">
            500m
          </button>
          <button type="button" data-radius="1000" data-zoom="15" class="radius-btn py-1 text-[11px] rounded-lg font-bold border transition-all bg-sky-500 text-white border-sky-400 shadow-sm shadow-sky-500/30">
            1km
          </button>
          <button type="button" data-radius="2000" data-zoom="14" class="radius-btn py-1 text-[11px] rounded-lg font-bold border transition-all text-slate-500 border-slate-200 bg-slate-50 hover:bg-slate-100">
            2km
          </button>
        </div>
      </div>

    </div>

    <!-- ステータスバッジ -->
    <div class="pointer-events-auto flex items-center justify-between px-3.5 py-1.5 rounded-xl bg-white/90 backdrop-blur-md border border-slate-200/80 text-[11px] text-slate-500 shadow-md">
      <div class="flex items-center gap-1.5 truncate pr-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="target-label" class="text-slate-800 font-bold truncate">Current Location</span>
      </div>
      <span id="status" class="text-sky-600 font-semibold whitespace-nowrap text-[10px]">Ready</span>
    </div>

    <!-- 画面移動時の「この周辺で検索」フローティングボタン -->
    <div id="search-area-container" class="pointer-events-auto flex justify-center hidden">
      <button 
        id="search-area-btn"
        class="animate-float-in px-4 py-2 rounded-full bg-white/95 hover:bg-white active:scale-95 text-sky-600 font-bold text-xs tracking-wide border border-sky-300 shadow-xl shadow-slate-300/60 backdrop-blur-lg flex items-center gap-2 transition-all cursor-pointer"
      >
        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
        <span id="search-area-text">この周辺で検索</span>
      </button>
    </div>

  </header>

  <!-- =============================== -->
  <!-- リスト表示ビュー（ライト仕様） -->
  <!-- =============================== -->
  <div id="list-view-container" class="fixed inset-0 z-30 bg-slate-50/95 backdrop-blur-xl pt-44 pb-20 px-4 overflow-y-auto hidden">
    <div class="max-w-md mx-auto flex flex-col gap-3">
      
      <!-- リスト用コントロール（ソート・絞り込み） -->
      <div class="bg-white border border-slate-200/90 p-3.5 rounded-2xl flex flex-col gap-2.5 shadow-sm">
        <div class="flex items-center justify-between text-xs">
          <span class="text-slate-600 font-bold flex items-center gap-1">
            <i data-lucide="arrow-up-down" class="w-3.5 h-3.5 text-sky-600"></i>
            <span id="sort-label">並び替え</span>
          </span>
          <select 
            id="list-sort-select"
            class="bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1 text-xs text-slate-800 focus:outline-none focus:border-sky-500 font-medium"
          >
            <option value="dist_asc">距離: 近い順 (Nearest)</option>
            <option value="dist_desc">距離: 遠い順 (Farthest)</option>
            <option value="wheelchair_first">多目的/車椅子優先 (Accessible)</option>
            <option value="free_first">無料優先 (Free first)</option>
          </select>
        </div>

        <!-- チェックボックスフィルター -->
        <div class="flex items-center gap-4 pt-2 border-t border-slate-100 text-xs">
          <label class="flex items-center gap-1.5 cursor-pointer text-slate-700 font-medium">
            <input type="checkbox" id="filter-wheelchair" class="rounded border-slate-300 text-sky-600 accent-sky-500" />
            <span id="filter-wheelchair-text">車椅子対応のみ</span>
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer text-slate-700 font-medium">
            <input type="checkbox" id="filter-free" class="rounded border-slate-300 text-sky-600 accent-sky-500" />
            <span id="filter-free-text">無料のみ</span>
          </label>
        </div>
      </div>

      <!-- リスト本体 -->
      <div id="toilet-list-cards" class="flex flex-col gap-2.5 pb-6"></div>
    </div>
  </div>

  <!-- =============================== -->
  <!-- フローティング現在地ボタン -->
  <!-- =============================== -->
  <div class="fixed bottom-6 right-4 z-40 flex flex-col gap-2.5">
    <button 
      id="locate-btn"
      type="button"
      class="w-12 h-12 rounded-2xl bg-white hover:bg-slate-50 active:scale-95 text-slate-700 border border-slate-200 shadow-xl shadow-slate-300/70 backdrop-blur-md flex items-center justify-center transition-all group"
      title="現在地を測位"
    >
      <i data-lucide="crosshair" class="w-5 h-5 text-sky-600 group-hover:rotate-45 transition-transform"></i>
    </button>
  </div>

  <!-- マップキャンバス -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const I18N = {
      ja: {
        langToggle: "EN",
        placeholder: "世界中の駅名・地名を入力 (例: 渋谷駅, Central Park)...",
        searchBtn: "検索",
        rangeLabel: "半径:",
        searchArea: "この周辺で検索",
        currentLocation: "現在地周辺",
        customLocation: "指定エリア",
        searching: "トイレを高速スキャン中...",
        locating: "GPS測位中...",
        found: (count, rad) => `半径${rad}に ${count} 件発見`,
        notFound: (query) => `「${query}」が見つかりませんでした。`,
        gpsDenied: "位置情報の取得が拒否されました",
        gpsUnsupported: "GPS非対応の端末です",
        networkError: "データ取得に失敗しました",
        popupTitle: "公衆トイレ",
        wheelchair: "車椅子・多目的",
        yes: "あり",
        no: "なし",
        unknown: "不明",
        fee: "利用料",
        free: "無料",
        paid: "有料",
        navigate: "ルート案内 (Google Maps)",
        walkMin: (m) => `徒歩 約${Math.max(1, Math.round(m / 80))}分`,
        sortLabel: "並び替え:",
        filterWheelchair: "車椅子対応のみ",
        filterFree: "無料のみ",
        noResults: "該当するトイレがありません",
        viewMap: "MAP",
        viewList: "LIST"
      },
      en: {
        langToggle: "JP",
        placeholder: "Search globally (e.g. Times Square, King's Cross)...",
        searchBtn: "Search",
        rangeLabel: "Radius:",
        searchArea: "Search this area",
        currentLocation: "Current Location",
        customLocation: "Custom Area",
        searching: "Scanning restrooms...",
        locating: "Acquiring GPS...",
        found: (count, rad) => `${count} restrooms in ${rad}`,
        notFound: (query) => `Could not find "${query}".`,
        gpsDenied: "Location permission denied",
        gpsUnsupported: "Geolocation unsupported",
        networkError: "Failed to fetch data",
        popupTitle: "Public Restroom",
        wheelchair: "Accessible",
        yes: "Yes",
        no: "No",
        unknown: "Unknown",
        fee: "Fee",
        free: "Free",
        paid: "Paid",
        navigate: "Directions (Google Maps)",
        walkMin: (m) => `~${Math.max(1, Math.round(m / 80))} min walk`,
        sortLabel: "Sort by:",
        filterWheelchair: "Accessible only",
        filterFree: "Free only",
        noResults: "No restrooms found matching criteria",
        viewMap: "MAP",
        viewList: "LIST"
      }
    };

    let currentLang = 'ja';
    let currentRadius = 1000;
    let currentZoom = 15;
    let currentCoords = { lat: 35.6812, lng: 139.7671 };
    let rawToiletsData = [];
    let markersMap = {};
    let activeView = 'map';
    let hasMovedManually = false;
    let abortController = null; // 以前のリクエストをキャンセルして高速化

    // 地図初期化（標準の明るい地図）
    const map = L.map('map', { 
      zoomControl: false,
      attributionControl: false 
    }).setView([currentCoords.lat, currentCoords.lng], currentZoom);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    let centerMarker = null;
    let searchCircle = null;
    let toiletLayerGroup = L.layerGroup().addTo(map);

    // DOM参照
    const statusEl = document.getElementById('status');
    const targetLabelEl = document.getElementById('target-label');
    const searchForm = document.getElementById('search-form');
    const searchInput = document.getElementById('search-input');
    const searchSubmitBtn = document.getElementById('search-submit-btn');
    const radiusLabel = document.getElementById('radius-label');
    const radiusButtons = document.querySelectorAll('.radius-btn');
    const searchAreaContainer = document.getElementById('search-area-container');
    const searchAreaBtn = document.getElementById('search-area-btn');
    const searchAreaText = document.getElementById('search-area-text');
    const langToggleBtn = document.getElementById('lang-toggle-btn');
    const langLabel = document.getElementById('lang-label');
    const locateBtn = document.getElementById('locate-btn');

    const listViewContainer = document.getElementById('list-view-container');
    const viewMapBtn = document.getElementById('view-map-btn');
    const viewListBtn = document.getElementById('view-list-btn');
    const tabMapText = document.getElementById('tab-map-text');
    const tabListText = document.getElementById('tab-list-text');
    const listSortSelect = document.getElementById('list-sort-select');
    const filterWheelchair = document.getElementById('filter-wheelchair');
    const filterFree = document.getElementById('filter-free');
    const toiletListCards = document.getElementById('toilet-list-cards');
    const sortLabel = document.getElementById('sort-label');
    const filterWheelchairText = document.getElementById('filter-wheelchair-text');
    const filterFreeText = document.getElementById('filter-free-text');

    // 2点間の距離計算 (m)
    function calcDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return Math.round(R * c);
    }

    // 言語適用
    function applyLanguage(lang) {
      currentLang = lang;
      const dict = I18N[lang];
      langLabel.textContent = dict.langToggle;
      searchInput.placeholder = dict.placeholder;
      searchSubmitBtn.querySelector('span').textContent = dict.searchBtn;
      radiusLabel.textContent = dict.rangeLabel;
      searchAreaText.textContent = dict.searchArea;
      tabMapText.textContent = dict.viewMap;
      tabListText.textContent = dict.viewList;
      sortLabel.textContent = dict.sortLabel;
      filterWheelchairText.textContent = dict.filterWheelchair;
      filterFreeText.textContent = dict.filterFree;

      if (centerMarker && centerMarker._isGPS) {
        targetLabelEl.textContent = dict.currentLocation;
      }
      lucide.createIcons();
      renderListView();
    }

    // ビュー切り替え
    function setViewMode(mode) {
      activeView = mode;
      if (mode === 'map') {
        listViewContainer.classList.add('hidden');
        viewMapBtn.className = "px-2.5 py-1 rounded-lg text-[10px] font-bold flex items-center gap-1 transition-all bg-white text-slate-900 shadow-sm";
        viewListBtn.className = "px-2.5 py-1 rounded-lg text-[10px] font-bold flex items-center gap-1 transition-all text-slate-500 hover:text-slate-800";
        setTimeout(() => map.invalidateSize(), 100);
      } else {
        listViewContainer.classList.remove('hidden');
        viewListBtn.className = "px-2.5 py-1 rounded-lg text-[10px] font-bold flex items-center gap-1 transition-all bg-white text-slate-900 shadow-sm";
        viewMapBtn.className = "px-2.5 py-1 rounded-lg text-[10px] font-bold flex items-center gap-1 transition-all text-slate-500 hover:text-slate-800";
        renderListView();
      }
    }

    // リスト描画
    function renderListView() {
      const dict = I18N[currentLang];
      toiletListCards.innerHTML = '';

      if (rawToiletsData.length === 0) {
        toiletListCards.innerHTML = `
          <div class="p-8 text-center bg-white border border-dashed border-slate-200 rounded-2xl text-slate-400 text-xs">
            ${dict.noResults}
          </div>
        `;
        return;
      }

      let items = rawToiletsData.map(item => {
        const dist = calcDistance(currentCoords.lat, currentCoords.lng, item.lat, item.lon);
        return { ...item, distance: dist };
      });

      if (filterWheelchair.checked) {
        items = items.filter(i => (i.tags?.wheelchair === 'yes'));
      }
      if (filterFree.checked) {
        items = items.filter(i => (i.tags?.fee !== 'yes'));
      }

      const sortType = listSortSelect.value;
      if (sortType === 'dist_asc') {
        items.sort((a, b) => a.distance - b.distance);
      } else if (sortType === 'dist_desc') {
        items.sort((a, b) => b.distance - a.distance);
      } else if (sortType === 'wheelchair_first') {
        items.sort((a, b) => {
          const aW = a.tags?.wheelchair === 'yes' ? 1 : 0;
          const bW = b.tags?.wheelchair === 'yes' ? 1 : 0;
          return bW - aW || a.distance - b.distance;
        });
      } else if (sortType === 'free_first') {
        items.sort((a, b) => {
          const aF = a.tags?.fee === 'yes' ? 0 : 1;
          const bF = b.tags?.fee === 'yes' ? 0 : 1;
          return bF - aF || a.distance - b.distance;
        });
      }

      if (items.length === 0) {
        toiletListCards.innerHTML = `
          <div class="p-8 text-center bg-white border border-dashed border-slate-200 rounded-2xl text-slate-400 text-xs">
            ${dict.noResults}
          </div>
        `;
        return;
      }

      items.forEach((item, index) => {
        const tags = item.tags || {};
        const isWheelchair = tags.wheelchair === 'yes';
        const isPaid = tags.fee === 'yes';
        const name = tags.name || `${dict.popupTitle} #${index + 1}`;
        const distStr = item.distance >= 1000 ? `${(item.distance / 1000).toFixed(1)}km` : `${item.distance}m`;

        const card = document.createElement('div');
        card.className = "bg-white border border-slate-200/90 hover:border-sky-300 p-3.5 rounded-2xl flex flex-col gap-2.5 transition-all cursor-pointer active:scale-[0.99] shadow-sm hover:shadow-md";
        
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-xl bg-sky-50 border border-sky-200 flex items-center justify-center text-sm">
                🚻
              </div>
              <div>
                <h4 class="text-xs font-bold text-slate-900 line-clamp-1">${name}</h4>
                <div class="flex items-center gap-2 text-[10px] text-slate-500 mt-0.5">
                  <span class="text-sky-600 font-bold">${distStr}</span>
                  <span>•</span>
                  <span>${dict.walkMin(item.distance)}</span>
                </div>
              </div>
            </div>

            <div class="flex flex-col items-end gap-1">
              <span class="text-[9px] px-2 py-0.5 rounded-full font-bold border ${isPaid ? 'bg-amber-50 border-amber-200 text-amber-700' : 'bg-emerald-50 border-emerald-200 text-emerald-700'}">
                ${isPaid ? dict.paid : dict.free}
              </span>
              ${isWheelchair ? `
                <span class="text-[9px] px-2 py-0.5 rounded-full font-bold bg-sky-50 border border-sky-200 text-sky-700">
                  ♿ ${dict.yes}
                </span>
              ` : ''}
            </div>
          </div>

          <div class="flex items-center justify-between pt-2 border-t border-slate-100">
            <span class="text-[10px] text-slate-400">タップして地図で確認</span>
            <a 
              href="https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lon}" 
              target="_blank" 
              onclick="event.stopPropagation();"
              class="px-3 py-1.5 rounded-xl bg-sky-500 hover:bg-sky-600 text-white font-bold text-[10px] flex items-center gap-1 shadow-sm transition-all"
            >
              <span>${dict.navigate}</span>
              <i data-lucide="external-link" class="w-3 h-3"></i>
            </a>
          </div>
        `;

        card.addEventListener('click', () => {
          setViewMode('map');
          map.setView([item.lat, item.lon], 17);
          const marker = markersMap[item.id];
          if (marker) {
            setTimeout(() => marker.openPopup(), 200);
          }
        });

        toiletListCards.appendChild(card);
      });

      lucide.createIcons({ root: toiletListCards });
    }

    // ★ 高速化されたOverpass API取得処理
    async function fetchToilets(lat, lng, radius) {
      const dict = I18N[currentLang];
      statusEl.textContent = dict.searching;
      toiletLayerGroup.clearLayers();
      markersMap = {};
      rawToiletsData = [];
      searchAreaContainer.classList.add('hidden');

      // 以前の進行中リクエストがあれば中断して高速化
      if (abortController) {
        abortController.abort();
      }
      abortController = new AbortController();

      // クエリ最適化: 必要最小限のタグと座標のみ出力してサーバー負荷と通信量を激減
      const query = `
        [out:json][timeout:10];
        (
          node["amenity"="toilets"](around:${radius}, ${lat}, ${lng});
          way["amenity"="toilets"](around:${radius}, ${lat}, ${lng});
        );
        out center body qt;
      `;

      try {
        const res = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: query,
          signal: abortController.signal
        });
        const data = await res.json();
        const elements = data.elements || [];

        const radiusStr = radius >= 1000 ? `${radius / 1000}km` : `${radius}m`;
        statusEl.textContent = dict.found(elements.length, radiusStr);

        elements.forEach(item => {
          const itemLat = item.lat || (item.center && item.center.lat);
          const itemLng = item.lon || (item.center && item.center.lon);
          if (!itemLat || !itemLng) return;

          const toiletObj = {
            id: item.id,
            lat: itemLat,
            lon: itemLng,
            tags: item.tags || {}
          };
          rawToiletsData.push(toiletObj);

          const tags = toiletObj.tags;
          let isWheelchair = dict.unknown;
          if (tags.wheelchair === 'yes') isWheelchair = dict.yes;
          else if (tags.wheelchair === 'no') isWheelchair = dict.no;

          const fee = tags.fee === 'yes' ? dict.paid : dict.free;
          const dist = calcDistance(currentCoords.lat, currentCoords.lng, itemLat, itemLng);
          const distStr = dist >= 1000 ? `${(dist / 1000).toFixed(1)}km` : `${dist}m`;

          // 明るく視認性の高いカスタムピン（爽やかなブルー）
          const customIcon = L.divIcon({
            className: 'custom-toilet-icon',
            html: `
              <div class="w-8 h-8 rounded-full bg-white border-2 border-sky-500 shadow-md flex items-center justify-center hover:scale-110 active:scale-95 transition-transform">
                <span class="text-sm">🚻</span>
              </div>
            `,
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -18]
          });

          const marker = L.marker([itemLat, itemLng], { icon: customIcon });

          marker.bindPopup(`
            <div class="p-4 flex flex-col gap-2.5 min-w-[210px]">
              <div class="flex items-center gap-2 border-b border-slate-100 pb-2">
                <div class="w-7 h-7 rounded-lg bg-sky-50 text-sky-600 flex items-center justify-center font-bold text-xs border border-sky-200">
                  🚻
                </div>
                <div>
                  <h4 class="text-xs font-bold text-slate-900">${tags.name || dict.popupTitle}</h4>
                  <p class="text-[10px] text-slate-500">${distStr} (${dict.walkMin(dist)})</p>
                </div>
              </div>

              <div class="text-[11px] space-y-1 text-slate-600">
                <div class="flex justify-between">
                  <span class="text-slate-400">${dict.wheelchair}:</span>
                  <span class="font-bold text-slate-800">${isWheelchair}</span>
                </div>
                <div class="flex justify-between">
                  <span class="text-slate-400">${dict.fee}:</span>
                  <span class="font-bold text-slate-800">${fee}</span>
                </div>
              </div>

              <a href="https://www.google.com/maps/dir/?api=1&destination=${itemLat},${itemLng}" 
                 target="_blank" 
                 class="mt-1 flex items-center justify-center gap-1.5 w-full py-2 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 text-white font-bold text-[11px] rounded-xl shadow-md shadow-sky-500/20 transition-all">
                <span>${dict.navigate}</span>
              </a>
            </div>
          `);

          toiletLayerGroup.addLayer(marker);
          markersMap[item.id] = marker;
        });

        renderListView();

      } catch (err) {
        if (err.name !== 'AbortError') {
          statusEl.textContent = dict.networkError;
        }
      }
    }

    // 中心更新
    function updateCenter(lat, lng, labelText, isGPS = false) {
      currentCoords = { lat, lng };
      targetLabelEl.textContent = labelText;

      map.setView([lat, lng], currentZoom);

      if (centerMarker) {
        centerMarker.setLatLng([lat, lng]);
      } else {
        centerMarker = L.circleMarker([lat, lng], {
          radius: 9,
          fillColor: isGPS ? '#0284c7' : '#ef4444',
          color: '#ffffff',
          weight: 2.5,
          fillOpacity: 1
        }).addTo(map);
      }
      centerMarker._isGPS = isGPS;
      centerMarker.setStyle({ fillColor: isGPS ? '#0284c7' : '#ef4444' });

      // 明るいブルーの範囲サークル
      if (searchCircle) {
        searchCircle.setLatLng([lat, lng]).setRadius(currentRadius);
      } else {
        searchCircle = L.circle([lat, lng], {
          radius: currentRadius,
          color: '#0284c7',
          weight: 1.5,
          opacity: 0.6,
          fillColor: '#0284c7',
          fillOpacity: 0.05
        }).addTo(map);
      }

      fetchToilets(lat, lng, currentRadius);
    }

    // 画面移動検知
    map.on('movestart', () => { hasMovedManually = true; });
    map.on('moveend', () => {
      if (hasMovedManually && activeView === 'map') {
        const center = map.getCenter();
        const dist = map.distance([currentCoords.lat, currentCoords.lng], center);
        if (dist > 150) searchAreaContainer.classList.remove('hidden');
      }
    });

    searchAreaBtn.addEventListener('click', () => {
      const center = map.getCenter();
      const dict = I18N[currentLang];
      updateCenter(center.lat, center.lng, dict.customLocation, false);
      hasMovedManually = false;
    });

    // 半径変更
    radiusButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        radiusButtons.forEach(b => {
          b.className = 'radius-btn py-1 text-[11px] rounded-lg font-bold border transition-all text-slate-500 border-slate-200 bg-slate-50 hover:bg-slate-100';
        });
        btn.className = 'radius-btn py-1 text-[11px] rounded-lg font-bold border transition-all bg-sky-500 text-white border-sky-400 shadow-sm shadow-sky-500/30';

        currentRadius = parseInt(btn.dataset.radius);
        currentZoom = parseInt(btn.dataset.zoom);
        map.setZoom(currentZoom);

        if (searchCircle) searchCircle.setRadius(currentRadius);
        fetchToilets(currentCoords.lat, currentCoords.lng, currentRadius);
      });
    });

    // 地名検索処理
    async function searchPlace(query) {
      if (!query.trim()) return;
      const dict = I18N[currentLang];
      statusEl.textContent = dict.searching;

      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
      try {
        const res = await fetch(url, { headers: { 'Accept-Language': currentLang } });
        const data = await res.json();
        if (data.length === 0) {
          alert(dict.notFound(query));
          statusEl.textContent = "Not found";
          return;
        }

        const item = data[0];
        hasMovedManually = false;
        updateCenter(parseFloat(item.lat), parseFloat(item.lon), item.display_name.split(',')[0], false);
      } catch (err) {
        statusEl.textContent = dict.networkError;
      }
    }

    // GPS取得
    function locateUser() {
      const dict = I18N[currentLang];
      statusEl.textContent = dict.locating;
      if (!navigator.geolocation) {
        statusEl.textContent = dict.gpsUnsupported;
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          hasMovedManually = false;
          updateCenter(pos.coords.latitude, pos.coords.longitude, dict.currentLocation, true);
        },
        (err) => { statusEl.textContent = dict.gpsDenied; },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // ★ 検索フォーム送信イベント（エンター時に即キーボードを閉じる）
    searchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      // スマホのソフトキーボードを下げる
      searchInput.blur();

      const val = searchInput.value.trim();
      if (val) searchPlace(val);
    });

    locateBtn.addEventListener('click', locateUser);
    viewMapBtn.addEventListener('click', () => setViewMode('map'));
    viewListBtn.addEventListener('click', () => setViewMode('list'));
    listSortSelect.addEventListener('change', renderListView);
    filterWheelchair.addEventListener('change', renderListView);
    filterFree.addEventListener('change', renderListView);

    langToggleBtn.addEventListener('click', () => {
      applyLanguage(currentLang === 'ja' ? 'en' : 'ja');
      fetchToilets(currentCoords.lat, currentCoords.lng, currentRadius);
    });

    // 起動
    lucide.createIcons();
    applyLanguage('ja');
    locateUser();
  </script>
</body>
</html>
