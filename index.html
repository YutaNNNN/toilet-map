<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>即トイレ MAP</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #map { height: 100vh; width: 100vw; z-index: 10; }
  </style>
</head>
<body class="bg-neutral-900 text-neutral-100 overflow-hidden m-0 p-0 font-sans">

  <!-- ヘッダー・操作パネル -->
  <div class="fixed top-3 left-3 right-3 z-50 flex flex-col gap-2 bg-neutral-900/95 backdrop-blur-md border border-neutral-800 p-3 rounded-2xl shadow-2xl">
    
    <!-- 検索バー ＆ 現在地ボタン -->
    <form id="search-form" class="flex gap-2">
      <div class="relative flex-1">
        <input 
          id="search-input" 
          type="text" 
          placeholder="駅名・地名を入力 (例: 新宿駅, 鎌ヶ谷駅)" 
          class="w-full bg-neutral-800 border border-neutral-700 rounded-xl px-3.5 py-2 text-xs text-neutral-100 placeholder-neutral-500 focus:outline-none focus:border-amber-400"
        />
      </div>
      <button 
        type="submit" 
        class="px-3.5 py-2 bg-amber-500 active:scale-95 text-neutral-950 font-bold text-xs rounded-xl shadow transition-all whitespace-nowrap"
      >
        検索
      </button>
      <button 
        type="button" 
        id="locate-btn" 
        class="px-3 py-2 bg-neutral-800 border border-neutral-700 active:scale-95 text-neutral-200 text-xs rounded-xl shadow transition-all whitespace-nowrap flex items-center gap-1"
        title="現在地に戻る"
      >
        📍 現在地
      </button>
    </form>

    <!-- 検索距離の選択チップ -->
    <div class="flex items-center justify-between gap-1 pt-1 border-t border-neutral-800/80">
      <span class="text-[11px] text-neutral-400 font-medium whitespace-nowrap mr-1">検索半径:</span>
      <div class="grid grid-cols-4 gap-1.5 flex-1" id="radius-selector">
        <button type="button" data-radius="300" data-zoom="17" class="radius-btn py-1 text-xs rounded-lg font-semibold border transition-all text-neutral-400 border-neutral-800 bg-neutral-950 hover:border-neutral-700">
          300m
        </button>
        <button type="button" data-radius="500" data-zoom="16" class="radius-btn py-1 text-xs rounded-lg font-semibold border transition-all text-neutral-400 border-neutral-800 bg-neutral-950 hover:border-neutral-700">
          500m
        </button>
        <button type="button" data-radius="1000" data-zoom="15" class="radius-btn active py-1 text-xs rounded-lg font-semibold border transition-all bg-amber-500 text-neutral-950 border-amber-400 shadow">
          1km
        </button>
        <button type="button" data-radius="2000" data-zoom="14" class="radius-btn py-1 text-xs rounded-lg font-semibold border transition-all text-neutral-400 border-neutral-800 bg-neutral-950 hover:border-neutral-700">
          2km
        </button>
      </div>
    </div>

    <!-- ステータス・件数表示 -->
    <div class="flex items-center justify-between px-1 text-[11px] text-neutral-400">
      <span id="target-label" class="font-medium text-neutral-200 truncate max-w-[200px]">現在地周辺</span>
      <span id="status" class="text-amber-400">取得中...</span>
    </div>
  </div>

  <!-- マップエリア -->
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let currentRadius = 1000; // デフォルト 1000m
    let currentZoom = 15;
    let currentCoords = { lat: 35.6812, lng: 139.7671 }; // 基準地点
    let currentLabel = "現在地";

    const map = L.map('map', { zoomControl: false }).setView([currentCoords.lat, currentCoords.lng], currentZoom);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    let centerMarker = null;
    let searchCircle = null; // 検索範囲を可視化する円
    let toiletLayerGroup = L.layerGroup().addTo(map);

    const statusEl = document.getElementById('status');
    const targetLabelEl = document.getElementById('target-label');
    const searchForm = document.getElementById('search-form');
    const searchInput = document.getElementById('search-input');
    const radiusButtons = document.querySelectorAll('.radius-btn');

    // トイレデータの取得
    async function fetchToilets(lat, lng, radius) {
      statusEl.textContent = `${radius >= 1000 ? (radius / 1000) + 'km' : radius + 'm'} 以内を検索中...`;
      toiletLayerGroup.clearLayers();

      const query = `
        [out:json][timeout:15];
        (
          node["amenity"="toilets"](around:${radius}, ${lat}, ${lng});
          way["amenity"="toilets"](around:${radius}, ${lat}, ${lng});
        );
        out center;
      `;

      try {
        const res = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: query
        });
        const data = await res.json();
        const elements = data.elements || [];

        const radiusStr = radius >= 1000 ? `${radius / 1000}km` : `${radius}m`;
        statusEl.textContent = `半径${radiusStr}に ${elements.length} 件`;

        elements.forEach(item => {
          const itemLat = item.lat || (item.center && item.center.lat);
          const itemLng = item.lon || (item.center && item.center.lon);
          if (!itemLat || !itemLng) return;

          const tags = item.tags || {};
          const isWheelchair = tags.wheelchair === 'yes' ? 'あり（多目的）' : (tags.wheelchair === 'no' ? 'なし' : '不明');
          const fee = tags.fee === 'yes' ? '有料' : '無料';

          const marker = L.marker([itemLat, itemLng]);
          marker.bindPopup(`
            <div class="text-neutral-900 text-xs font-sans leading-relaxed">
              <strong class="text-sm block mb-1">🚻 公衆トイレ</strong>
              <div>多目的/車椅子: <strong>${isWheelchair}</strong></div>
              <div>利用料: <strong>${fee}</strong></div>
              <a href="https://www.google.com/maps/dir/?api=1&destination=${itemLat},${itemLng}" 
                 target="_blank" 
                 class="mt-2.5 inline-block w-full text-center px-2 py-1.5 bg-amber-500 text-neutral-950 font-bold rounded-lg shadow">
                Googleマップで経路案内
              </a>
            </div>
          `);
          toiletLayerGroup.addLayer(marker);
        });

      } catch (err) {
        statusEl.textContent = 'データ取得に失敗しました';
        console.error(err);
      }
    }

    // 検索中心地点と範囲円の更新
    function updateCenter(lat, lng, labelText, isGPS = false) {
      currentCoords = { lat, lng };
      currentLabel = labelText;
      targetLabelEl.textContent = labelText;

      map.setView([lat, lng], currentZoom);

      // 中心ピン
      if (centerMarker) {
        centerMarker.setLatLng([lat, lng]);
      } else {
        centerMarker = L.circleMarker([lat, lng], {
          radius: 9,
          fillColor: isGPS ? '#3b82f6' : '#ef4444',
          color: '#ffffff',
          weight: 2.5,
          fillOpacity: 0.95
        }).addTo(map);
      }
      centerMarker.setStyle({ fillColor: isGPS ? '#3b82f6' : '#ef4444' });

      // 検索範囲を示す薄いサークル
      if (searchCircle) {
        searchCircle.setLatLng([lat, lng]).setRadius(currentRadius);
      } else {
        searchCircle = L.circle([lat, lng], {
          radius: currentRadius,
          color: '#f59e0b',
          weight: 1.5,
          opacity: 0.6,
          fillColor: '#f59e0b',
          fillOpacity: 0.08
        }).addTo(map);
      }

      fetchToilets(lat, lng, currentRadius);
    }

    // 距離ボタンの切り替え処理
    radiusButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        radiusButtons.forEach(b => {
          b.className = 'radius-btn py-1 text-xs rounded-lg font-semibold border transition-all text-neutral-400 border-neutral-800 bg-neutral-950 hover:border-neutral-700';
        });
        btn.className = 'radius-btn active py-1 text-xs rounded-lg font-semibold border transition-all bg-amber-500 text-neutral-950 border-amber-400 shadow';

        currentRadius = parseInt(btn.dataset.radius);
        currentZoom = parseInt(btn.dataset.zoom);
        map.setZoom(currentZoom);

        if (searchCircle) searchCircle.setRadius(currentRadius);
        fetchToilets(currentCoords.lat, currentCoords.lng, currentRadius);
      });
    });

    // 駅・地名の検索 (Nominatim)
    async function searchPlace(query) {
      if (!query.trim()) return;
      statusEl.textContent = '場所を特定中...';

      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
      try {
        const res = await fetch(url, { headers: { 'Accept-Language': 'ja' } });
        const data = await res.json();
        if (data.length === 0) {
          statusEl.textContent = '見つかりませんでした';
          alert(`「${query}」が見つかりませんでした。駅名や市町村名を加えて再度お試しください。`);
          return;
        }

        const item = data[0];
        const lat = parseFloat(item.lat);
        const lng = parseFloat(item.lon);
        const displayName = item.display_name.split(',')[0];

        updateCenter(lat, lng, displayName, false);
      } catch (err) {
        statusEl.textContent = '検索エラーが発生しました';
        console.error(err);
      }
    }

    // GPS取得
    function locateUser() {
      statusEl.textContent = 'GPS取得中...';
      if (!navigator.geolocation) {
        statusEl.textContent = 'GPS非対応';
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          updateCenter(pos.coords.latitude, pos.coords.longitude, "現在地", true);
        },
        (err) => {
          statusEl.textContent = '位置情報の取得が拒否されました';
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    searchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = searchInput.value.trim();
      if (val) searchPlace(val);
    });

    document.getElementById('locate-btn').addEventListener('click', locateUser);

    // 初回起動
    locateUser();
  </script>
</body>
</html>
